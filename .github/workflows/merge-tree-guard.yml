# Single-pass CI (D-190) verifies only the pull-request preview merge tree, so
# when two pull requests merge back to back the second one's landed combination
# was never run (D-190 §5 residual risk). This thin guard closes that gap: every
# push to main is judged by tools/ci/verify-merge-tree.py — the single
# implementation of the criterion "tree(merge) == tree(merge^2)". A merge that
# introduced nothing beyond the verified pull-request tip is zero action;
# anything else (or an unreadable check) dispatches a full run of ci.yml on
# main, the same manual path documented in docs/CONTRIBUTING.md.
#
# Squash landings (D-302, T3): a squash commit has one parent, so the criterion
# above cannot see it and the guard would dispatch on every merge. The same step
# therefore asks `verify-merge-tree.py --squash-evidence`, which judges the
# commit from records that cannot drift (the merged pull request's mergeCommit
# identity, its head tree, and its required checks). Zero action is taken only
# when that evidence is complete, and only after scanning the landed commit for
# traces, because a squash message is written at merge time and no pull-request
# run ever saw it.
name: Merge tree guard

on:
  push:
    branches: [main]

# Only what the judgement and the dispatch need: read the pushed history, and
# create a workflow_dispatch event for ci.yml. Never contents: write.
permissions:
  contents: read
  actions: write
  pull-requests: read
  checks: read
  statuses: read

# No concurrency block on purpose. The guard costs seconds, and cancelling an
# in-progress guard could swallow exactly the dispatch this workflow exists for
# (the second of two back-to-back merges). Dispatched ci.yml runs collapse
# through ci.yml's own concurrency group instead.
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # Default depth 1 cannot resolve HEAD^2; the criterion needs the second
      # parent of the merge commit, so the full history is required.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Guard the landed merge tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parents="$(git rev-list --parents -n 1 HEAD)"
          echo "pushed commit and parents: $parents"
          set +e
          python3 tools/ci/verify-merge-tree.py $parents
          status=$?
          set -e
          case $status in
            0)
              echo "landed tree matches the verified pull-request tree: zero action"
              ;;
            1)
              echo "the merge criterion does not apply; checking the squash evidence"
              set +e
              python3 tools/ci/verify-merge-tree.py --squash-evidence --landed HEAD
              squash=$?
              set -e
              if [ "$squash" -eq 0 ]; then
                # A squash message is written at merge time and never scanned by
                # a pull-request run, so the zero-action path scans the landed
                # commit itself before deciding anything.
                echo "squash evidence complete: scanning the landed commit"
                TRACE_BASE_SHA="$(git rev-parse HEAD^)" bash tools/ci/trace-scan.sh
                echo "zero action: landed tree, checks and trace are all accounted for"
              else
                echo "squash evidence incomplete: dispatching full CI on main"
                gh workflow run ci.yml --ref main
              fi
              ;;
            *)
              echo "merge tree guard failed to judge (exit $status): treating as blocking"
              exit "$status"
              ;;
          esac
