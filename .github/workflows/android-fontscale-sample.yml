# P8-00 V-8 / P8-01a i3b / P8-02 V-9 font-scale sample (manual, non-blocking, never a PR gate).
#
# WHAT ONE GREEN RUN PRODUCES
# ---------------------------
# V-8 of `docs/specs/2026-11-08-p8-00-visual-nav-baseline-design.md` section 5 asks for the
# empty-state samples and for "1.3x font scale must not overflow"; P8-01a's
# `docs/specs/2026-11-11-p8-01-account-reconciliation-design.md` section 6 additionally requires a
# pre-merge device read of the detail screen and the queue copy. Both legs run here at the
# requested `system font_scale`:
#
# - `profile=empty` (default): the three empty-ledger screens on a **fresh empty install**
#   (`home.png` / `asset.png` / `analysis.png`); an empty ledger is exactly the state V-8 samples,
#   so no fixture is generated.
# - `profile=seeded`: the same APK over one prepared v36 database pushed into the app's stable
#   storage before launch, capturing `search-guide.png` / `search-results.png` (the P8-02 search surface, guide and result faces), `detail.png` (the 交易详情 screen) and
#   `reconciliation.png` (the 账户对账 queue) — the read-only surfaces P8-01a adds; the two search faces are P8-02 V-9.
#
# The artifact is the evidence a human reads: each screen's screenshot plus its accessibility dump
# at that scale. The `gate` step re-derives only what is mechanically decidable — the scale took
# effect, the recorded profile matches the one asked for, every screenshot is a real image, each
# screen's marker text is still in the accessibility tree (a clipped row loses its text node; an
# overflowing one pushes it out of the window), no string the previous screen renders is still
# visible (a navigation that did not land is not evidence), and the seed digest host.json records
# is the seed file's own (a gate can never be re-derived over a different database). "No visual
# overflow" stays a human judgement on the artifact.
#
# WHY CLOUD
# ---------
# The development host's adb surface belongs to the user's own emulator (D-281), so this chain
# never boots a local emulator: `tools/ci/android-fontscale.py` refuses to run outside a
# GitHub-hosted Linux runner, and the first steps below bind the run to one exact commit so the
# APK it installs is the tree it claims. The seeded profile's database is produced by the same
# checkout, before the emulator session, through `:ledger-data:jvmTest` (the seed writer test).
name: Android font-scale sample

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to sample
        required: true
        type: string
      profile:
        description: 'empty = the three empty-ledger screens; seeded = 搜索引导 + 搜索结果 + 交易详情 + 账户对账（4 屏）'
        required: false
        default: 'empty'
        type: choice
        options:
          - empty
          - seeded
      font_scale:
        description: Font scale to apply (V-8 asks for 1.3)
        required: false
        default: '1.3'
        type: string

permissions:
  contents: read

concurrency:
  # One manual round per run: a later dispatch of the same SHA must stay tellable apart and
  # must never cancel evidence already tied to a chosen commit.
  group: android-fontscale-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  font-scale-sample:
    name: Font-scale sample
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      LANG: zh_CN.UTF-8
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvmargs=-Xmx2g
      PROFILE: ${{ inputs.profile }}
      # The seed database stays OUTSIDE the evidence directory: evidence artifacts never carry a
      # database (the android-scale convention); only its hash is uploaded.
      SEED_DB: fontscale-seed/ledger.db
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
      - name: Assert the checkout is the requested commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Build the debug APK outside the emulator session
        run: ./gradlew --no-daemon --max-workers=1 :android-app:assembleDebug --warning-mode all
      - name: Record the APK hash this run installs
        run: |
          set -euo pipefail
          mkdir -p fontscale-evidence
          sha256sum android-app/build/outputs/apk/debug/android-app-debug.apk | tee fontscale-evidence/host-apk.txt
      - name: Write the seeded ledger database (seeded profile only)
        if: github.event.inputs.profile == 'seeded'
        # The writer is a jvmTest no-op unless this property names its output; the build script
        # forwards the property to the test JVM (Gradle does not pass -D through by itself).
        run: |
          set -euo pipefail
          mkdir -p fontscale-evidence fontscale-seed
          ./gradlew --no-daemon --max-workers=1 :ledger-data:jvmTest \
            --tests 'com.unifiedledger.data.P801FontscaleSeedWriterTest' \
            "-Dul.fontscale.seed=${PWD}/${SEED_DB}"
          sha256sum "${SEED_DB}" | tee fontscale-evidence/host-seed.txt
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the requested profile's screens at the requested scale
        timeout-minutes: 45
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FONT_SCALE: ${{ inputs.font_scale }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: ul-fontscale
          profile: pixel_6
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -u
            python3 tools/ci/android-fontscale.py run --evidence fontscale-evidence --sha "${EXPECTED_SHA}" --profile "${PROFILE}" --seed "${SEED_DB}" --font-scale "${FONT_SCALE}" --avd-name ul-fontscale
      - name: Re-derive the gate from the evidence on disk
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FONT_SCALE: ${{ inputs.font_scale }}
        run: python3 tools/ci/android-fontscale.py gate --evidence fontscale-evidence --sha "${EXPECTED_SHA}" --profile "${PROFILE}" --seed "${SEED_DB}" --font-scale "${FONT_SCALE}"
      - name: Upload the sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fontscale-sample-${{ inputs.expected_sha }}-${{ inputs.profile }}
          path: fontscale-evidence
          retention-days: 30
