# P8-00 V-8 / P8-01a i3b / P8-02 V-9 / P8-03 V-14 font-scale sample (manual, non-blocking, never a PR gate).
#
# WHAT ONE GREEN RUN PRODUCES
# ---------------------------
# V-8 of `docs/specs/2026-11-08-p8-00-visual-nav-baseline-design.md` section 5 asks for the
# empty-state samples and for "1.3x font scale must not overflow"; P8-01a's
# `docs/specs/2026-11-11-p8-01-account-reconciliation-design.md` section 6 additionally requires a
# pre-merge device read of the detail screen and the queue copy. All legs run here at the
# requested `system font_scale`:
#
# - `profile=empty` (default): the three empty-ledger screens on a **fresh empty install**
#   (`home.png` / `asset.png` / `analysis.png`); an empty ledger is exactly the state V-8 samples,
#   so no fixture is generated. Each screen then speaks its own copy through REAL TalkBack and
#   leaves its per-target png (`talkback-<screen>-cmd-<id>.png`).
# - `profile=seeded`: the same APK over one prepared v37 database pushed into the app's stable
#   storage before launch, capturing `search-guide.png` / `search-results.png` (the P8-02 search surface, guide and result faces), `detail.png` (the 交易详情 screen) and
#   `reconciliation.png` (the 账户对账 queue) — the read-only surfaces P8-01a adds; the two search faces are P8-02 V-9. The guide face and the result face each speak one target (the
#   condition-area copy, the seeded transfer's row) and leave their per-target pngs; the detail and
#   queue screens stay screenshot-only.
# - `profile=refund` (P8-03 V-14): the same seeded database, whose confirmed manual expense is the
#   selectable original, capturing `refund-entry.png` (the refund type selected and the candidate
#   read landed) and `refund-confirmation.png` (original, arrival account, amount and occurred-at
#   filled, then 继续, at 1.3x) — the human read V-14 asks for. Both screens speak one target each
#   (the candidate row's expense-leg cap, the confirmation's inherited-category row).
# - `profile=p806` (P8-06 batch 6 V-12): an independent anonymous seed of two fixed expenses on
#   one clock-relative day, capturing `report.png` (the ANALYSIS report region),
#   `report-daily-average.png` (the same region scrolled until the natural-day statement reads in
#   full), `calendar.png` (the month grid with the seeded day cell) and `day-detail.png` (that
#   day's drilldown rows) at 1.3x. Month, day, count and exact signed amounts are re-derived from
#   the seed database by both the driver and the gate. The run then drives REAL TalkBack on the
#   image's own package (D-292): the androidTest focus probe moves accessibility focus to each
#   target on the three speech screens (report, calendar, day-detail; the natural-day note screen
#   carries no speech check), TalkBack's VERBOSE `SpeechControllerImpl` utterance log is captured
#   inside that target's time window, and each speech screen is classified as not-obtained /
#   fragments-missing / amount-wrong / success. The p806 gate fails unless every ordered speech
#   target is success; the screenshot and accessibility-dump artifacts are captured before that leg
#   and stay independent of it.
# - `profile=presentation` (D-369 E1): the presentation surfaces over the dedicated P369 seed
#   (ordinary expense, transfer, multi-category, multi-currency, empty day, single-category
#   ranking and the management route; the cross-day reconciliation and technical-collapse faces
#   land in Block B). Twelve frames plus their accessibility dumps and REAL TalkBack on every
#   screen's target. `ui_mode=light|dark` selects the platform night mode (default light) and both
#   the driver and the gate record/compare it. `PRESENTATION_EVIDENCE_PLAN` and
#   `PRESENTATION_SCENARIO_STEMS` in `tools/python/android_fontscale/sampler.py` own the
#   scenario-to-screen mapping; the four-combination sweep lives in
#   `android-presentation-evidence.yml`, and this single-profile dispatch remains the per-combination
#   entry point.
#
# The artifact is the evidence a human reads: each screen's screenshot plus its accessibility dump
# at that scale. The `gate` step re-derives only what is mechanically decidable — the scale took
# effect, the recorded profile matches the one asked for, every screenshot is a real image, each
# screen's marker text is still in the accessibility tree (a row removed from the composition loses
# its text node; a scrollable screen's off-screen children stay in the tree, so marker presence is
# NOT a viewport-containment claim), no string the previous screen renders is still present (a
# navigation that did not land is not evidence), and the seed digest host.json records is the seed
# file's own (a gate can never be re-derived over a different database). For every profile whose
# screens carry speech checks it also re-parses each ordered target's own raw TalkBack window, bound
# to its own command ID and the component the run actually enabled, and requires 成功: 未取得,
# 片段缺失 and 金额错误 are named failures, and the recorded APK hashes must match the files on
# disk. The three screenshot profiles additionally record the device's TalkBack versionName and API
# level — re-parsed by the gate from the raw `dumpsys package` artifact, never trusted from
# host.json — and must show one png of at least 20 000 bytes per target, named by that target's
# command ID. "No visual overflow"
# stays a human judgement on the artifact.
#
# WHY CLOUD
# ---------
# The development host's adb surface belongs to the user's own emulator (D-281), so this chain
# never boots a local emulator: `tools/ci/android-fontscale.py` refuses to run outside a
# GitHub-hosted Linux runner, and the first steps below bind the run to one exact commit so the
# APK it installs is the tree it claims. The seeded profiles' database is produced by the same
# checkout, before the emulator session, through `:ledger-data:jvmTest` (the seed writer test).
name: Android font-scale sample

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to sample
        required: true
        type: string
      profile:
        description: 'empty = 三个空账本屏；seeded = 搜索引导 + 搜索结果 + 交易详情 + 账户对账（4 屏）；refund = 退款到账入口 + 确认页（2 屏）；p806 = 报表 + 报表自然日说明 + 日历日格 + 日明细（4 屏）；presentation = 呈现专项 E1 屏表（12 屏，独立 P369 种子）；均含真实 TalkBack 朗读'
        required: false
        default: 'empty'
        type: choice
        options:
          - empty
          - seeded
          - refund
          - p806
          - presentation
      ui_mode:
        description: 'Platform night mode for this sample: light (default) or dark'
        required: false
        default: 'light'
        type: choice
        options:
          - light
          - dark
      font_scale:
        description: Font scale to apply (V-8 asks for 1.3)
        required: false
        default: '1.3'
        type: string

permissions:
  contents: read

concurrency:
  # One manual round per run: a later dispatch of the same SHA must stay tellable apart and
  # must never cancel evidence already tied to a chosen commit.
  group: android-fontscale-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  font-scale-sample:
    name: Font-scale sample
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      LANG: zh_CN.UTF-8
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvmargs=-Xmx2g
      PROFILE: ${{ inputs.profile }}
      UI_MODE: ${{ inputs.ui_mode }}
      # The seed database stays OUTSIDE the evidence directory: evidence artifacts never carry a
      # database (the android-scale convention); only its hash is uploaded.
      SEED_DB: fontscale-seed/ledger.db
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
      - name: Assert the checkout is the requested commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Build the debug APK outside the emulator session
        run: ./gradlew --no-daemon --max-workers=1 :android-app:assembleDebug --warning-mode all
      - name: Record the APK hash this run installs
        run: |
          set -euo pipefail
          mkdir -p fontscale-evidence
          sha256sum android-app/build/outputs/apk/debug/android-app-debug.apk | tee fontscale-evidence/host-apk.txt
      - name: Build the androidTest APK that hosts the focus probe
        # D-292's probe is an androidTest service, never part of the product build; every profile
        # installs it, because the three screenshot profiles drive real TalkBack too (P8-07 batch
        # D). The run installs this APK and enables the probe component for the speech leg.
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=1 :android-app:assembleDebugAndroidTest --warning-mode all
          test -f android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk
          sha256sum android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk \
            | tee fontscale-evidence/host-test-apk.txt
      - name: Write the prepared ledger database (seeded, refund, p806 and presentation profiles only)
        if: inputs.profile == 'seeded' || inputs.profile == 'refund' || inputs.profile == 'p806' || inputs.profile == 'presentation'
        # Each writer is a jvmTest no-op unless its property names the output; the build script
        # forwards all properties to the test JVM (Gradle does not pass -D through by itself).
        # p806 and presentation each use their own writer and property, so their samples stay
        # independent of the P8-01/P8-03 ledger shape the other two seeded profiles share.
        run: |
          set -euo pipefail
          mkdir -p fontscale-evidence fontscale-seed
          if [ "${PROFILE}" = 'p806' ]; then
            ./gradlew --no-daemon --max-workers=1 :ledger-data:jvmTest \
              --tests 'com.unifiedledger.data.P806FontscaleSeedWriterTest' \
              "-Dul.p806.fontscale.seed=${PWD}/${SEED_DB}"
          elif [ "${PROFILE}" = 'presentation' ]; then
            ./gradlew --no-daemon --max-workers=1 :ledger-data:jvmTest \
              --tests 'com.unifiedledger.data.P369PresentationSeedWriterTest' \
              "-Dul.presentation.fontscale.seed=${PWD}/${SEED_DB}"
          else
            ./gradlew --no-daemon --max-workers=1 :ledger-data:jvmTest \
              --tests 'com.unifiedledger.data.P801FontscaleSeedWriterTest' \
              "-Dul.fontscale.seed=${PWD}/${SEED_DB}"
          fi
          sha256sum "${SEED_DB}" | tee fontscale-evidence/host-seed.txt
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the requested profile's screens at the requested scale
        timeout-minutes: 45
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FONT_SCALE: ${{ inputs.font_scale }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: ul-fontscale
          profile: pixel_6
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -u
            python3 tools/ci/android-fontscale.py run --evidence fontscale-evidence --sha "${EXPECTED_SHA}" --profile "${PROFILE}" --seed "${SEED_DB}" --font-scale "${FONT_SCALE}" --ui-mode "${UI_MODE}" --avd-name ul-fontscale --test-apk android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk
      - name: Re-derive the gate from the evidence on disk
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FONT_SCALE: ${{ inputs.font_scale }}
        run: python3 tools/ci/android-fontscale.py gate --evidence fontscale-evidence --sha "${EXPECTED_SHA}" --profile "${PROFILE}" --seed "${SEED_DB}" --font-scale "${FONT_SCALE}" --ui-mode "${UI_MODE}" --test-apk android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk
      - name: Upload the sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # D6: ui_mode and font_scale ride the name, so two dispatches of the same SHA and profile
          # (light vs dark, 1.3 vs 1.0) never overwrite each other's evidence.
          name: fontscale-sample-${{ inputs.expected_sha }}-${{ inputs.profile }}-${{ inputs.ui_mode }}-${{ inputs.font_scale }}
          path: fontscale-evidence
          retention-days: 30
