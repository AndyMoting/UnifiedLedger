name: CI

on:
  pull_request:
    branches: [main]
  # Manual full re-run on main. The only case that needs it is a merge whose tree
  # differs from the verified pull-request tree (see docs/CONTRIBUTING.md).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners have enough memory for the Android/KMP build, but the
# Gradle defaults are too small for compileAndroidMain and dex merging.
env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g
    -Dkotlin.daemon.jvmargs=-Xmx2g
    -Dorg.gradle.workers.max=5
  # Read only by tools/ci/ci-parallel.init.gradle.kts; local commands stay serial.
  CI_TEST_MAX_PARALLEL_FORKS: '4'

jobs:
  # :ledger-data:jvmTest (93 classes / 673 tests) is by far the longest task, so it is
  # split across three runners. tools/ci/ledger-data-shards.txt says which classes each
  # runner takes; the two coverage guards below keep that list honest.
  kotlin-core:
    name: Kotlin tests core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Cache Gradle build cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: gradle-build-cache-${{ runner.os }}-
      - name: Gradle check (every module except the sharded ledger-data test task)
        run: ./gradlew --no-daemon --max-workers=5 --parallel --build-cache --init-script tools/ci/ci-parallel.init.gradle.kts check -x :ledger-data:jvmTest :ledger-data:jvmTestClasses --warning-mode all
      - name: Ktlint check
        run: ./gradlew --no-daemon --max-workers=5 --build-cache --init-script tools/ci/ci-parallel.init.gradle.kts ktlintCheck --warning-mode all
      - name: Shared UI tests
        run: ./gradlew --no-daemon --max-workers=5 --build-cache --init-script tools/ci/ci-parallel.init.gradle.kts :app-ui:jvmTest --warning-mode all
      - name: Desktop app build
        run: ./gradlew --no-daemon --max-workers=5 --build-cache --init-script tools/ci/ci-parallel.init.gradle.kts :desktop-app:build --warning-mode all
      - name: SQLDelight migration
        run: ./gradlew --no-daemon --max-workers=5 --build-cache --init-script tools/ci/ci-parallel.init.gradle.kts :ledger-data:verifyCommonMainLedgerDatabaseMigration --warning-mode all
      - name: Every compiled test class is listed in the shard manifest
        run: python3 tools/ci/verify-shard-coverage.py --manifest tools/ci/ledger-data-shards.txt --classes ledger-data/build/classes/kotlin/jvm/test
      - name: Test timing report
        # Report-only: aggregates per-class JUnit XML timings into the job summary so
        # later tuning uses measured CI data. Never changes the check conclusion.
        if: always()
        run: python3 tools/ci/test-timing-report.py --root . --summary "$GITHUB_STEP_SUMMARY" --top 200

  ledger-data-shards:
    name: ledger-data shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI_TEST_MAX_PARALLEL_FORKS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Cache Gradle build cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: gradle-build-cache-${{ runner.os }}-
      - name: ledger-data jvmTest (shard ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t classes < <(awk -F'\t' -v s="$SHARD" '$1==s {print $2}' tools/ci/ledger-data-shards.txt)
          echo "shard $SHARD: ${#classes[@]} classes"
          args=()
          for one in "${classes[@]}"; do args+=(--tests "$one"); done
          ./gradlew --no-daemon --max-workers=4 --build-cache --init-script tools/ci/ci-parallel.init.gradle.kts :ledger-data:jvmTest "${args[@]}" --warning-mode all
      - name: Shard ran exactly its share of the manifest
        run: python3 tools/ci/verify-shard-coverage.py --manifest tools/ci/ledger-data-shards.txt --shard ${{ matrix.shard }} --results ledger-data/build/test-results/jvmTest
      - name: Test timing report
        if: always()
        run: python3 tools/ci/test-timing-report.py --root . --summary "$GITHUB_STEP_SUMMARY" --top 200

  kotlin-gate:
    # Owns the branch-protection context name "Kotlin tests". It must always run
    # (a skipped job would leave the required check pending forever) and it fails
    # whenever any Kotlin verification job failed.
    name: Kotlin tests
    needs: [kotlin-core, ledger-data-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Kotlin verification job to succeed
        run: |
          echo "kotlin-core=${{ needs.kotlin-core.result }}"
          echo "ledger-data-shards=${{ needs.ledger-data-shards.result }}"
          if [ "${{ needs.kotlin-core.result }}" != "success" ] || [ "${{ needs.ledger-data-shards.result }}" != "success" ]; then
            echo "::error::Kotlin verification did not fully succeed"
            exit 1
          fi

  android:
    name: Android compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Compile Android
        run: ./gradlew --no-daemon --max-workers=1 :ledger-data:compileAndroidMain --warning-mode all
      - name: Android app unit tests
        # P5-04.4 S2/S3: JVM unit tests for AndroidStartupController (no Robolectric). The
        # task set must match docs/CONTRIBUTING.md verification commands.
        run: ./gradlew --no-daemon --max-workers=1 :android-app:testDebugUnitTest --warning-mode all
      - name: Android app instrumented test sources compile
        # P0 hotfix (defect 1) guard: compile the androidTest sources so the absolute-driver-path
        # regression guard cannot rot without CI noticing. Execution stays the manual emulator
        # gate (CI keeps zero connectedAndroidTest).
        run: ./gradlew --no-daemon --max-workers=1 :android-app:assembleDebugAndroidTest --warning-mode all
      - name: Android app assemble debug
        run: ./gradlew --no-daemon --max-workers=1 :android-app:assembleDebug --warning-mode all
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk-${{ github.sha }}
          path: android-app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # The Python suite (46 modules / 809 tests, about 7 minutes) is split across two
  # runners; tools/ci/python-shards.txt says which modules each runner takes.
  python-shards:
    name: Python shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t modules < <(awk -F'\t' -v s="$SHARD" '$1==s {print $2}' tools/ci/python-shards.txt)
          echo "shard $SHARD: ${#modules[@]} modules"
          export PYTHONPATH=tools/python
          python -m unittest -v "${modules[@]}"
      - name: Project docs
        if: matrix.shard == 1
        run: |
          export PYTHONPATH=tools/python
          python -m project_docs .
      - name: Every Python test module is listed in the shard manifest
        run: python tools/ci/verify-shard-coverage.py --python-manifest tools/ci/python-shards.txt --tests-dir tests/python

  python-gate:
    # Owns the branch-protection context name "Python tests": it must always run and
    # fails whenever a Python shard failed.
    name: Python tests
    needs: [python-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python verification job to succeed
        run: |
          echo "python-shards=${{ needs.python-shards.result }}"
          if [ "${{ needs.python-shards.result }}" != "success" ]; then
            echo "::error::Python verification did not fully succeed"
            exit 1
          fi

  trace:
    name: Trace scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # The history scans (messages, paths, trees) must see the full
        # history; the checkout default of depth 1 would silently reduce
        # them to the tip commit.
        with:
          fetch-depth: 0
      - name: Trace scan
        run: bash tools/ci/trace-scan.sh
