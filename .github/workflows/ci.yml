name: CI

on:
  pull_request:
    branches: [main]
  # Manual full re-run on main. The only case that needs it is a merge whose tree
  # differs from the verified pull-request tree (see docs/CONTRIBUTING.md).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners have enough memory for the Android/KMP build, but the
# Gradle defaults are too small for compileAndroidMain and dex merging.
env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g
    -Dkotlin.daemon.jvmargs=-Xmx2g
    -Dorg.gradle.workers.max=5
  # Read only by tools/ci/ci-parallel.init.gradle.kts; local commands stay serial.
  CI_TEST_MAX_PARALLEL_FORKS: '4'

jobs:
  # Classifies the change as `docs` (only Markdown under docs/** and root *.md)
  # or `code` (every other path, and anything unreadable). The heavy jobs below
  # are skipped only for `docs`; a skipped job reports success, so the four
  # required check names stay satisfied. The Kotlin gate recomputes this
  # classification from the same commits and fails when the two disagree, which
  # catches wiring or state divergence; a bug in the rules themselves is caught
  # by the classifier's own unit test, which runs in the always-on Python shards
  # (D-302, T1).
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the pull request base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" || echo "::warning::base commit unavailable; the classifier falls back to code"
      - name: Classify the change
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          kind=$(python3 tools/ci/classify-changes.py --base "$BASE_SHA" --head HEAD)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  # :ledger-data:jvmTest (122 classes) is by far the longest task, so it is
  # split across five runners. tools/ci/ledger-data-shards.txt says which classes each
  # runner takes; the two coverage guards below keep that list honest (the class count is
  # the only figure the guards verify; the base 98/722 header had already drifted from the
  # manifest, so the unverifiable test count is no longer restated here).
  kotlin-core:
    # The profile artifact is a measurement input, not a verdict (D-303): a
    # six-fork trial oversubscribed the four-vCPU runner and is not kept, so the
    # profile of the standard four-fork run decides whether splitting the
    # aggregated task by subproject is worth a later batch.
    name: Kotlin tests core
    needs: [changes]
    if: needs.changes.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Cache Gradle build cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: gradle-build-cache-${{ runner.os }}-
      - name: Gradle check (every module except the sharded test and migration tasks)
        run: ./gradlew --no-daemon --max-workers=5 --parallel --build-cache --profile --init-script tools/ci/ci-parallel.init.gradle.kts check -x :ledger-data:jvmTest :ledger-data:jvmTestClasses -x :ledger-data:verifyCommonMainLedgerDatabaseMigration --warning-mode all
      - name: Ktlint check
        run: ./gradlew --no-daemon --max-workers=5 --build-cache --init-script tools/ci/ci-parallel.init.gradle.kts ktlintCheck --warning-mode all
      - name: Shared UI tests
        run: ./gradlew --no-daemon --max-workers=5 --build-cache --init-script tools/ci/ci-parallel.init.gradle.kts :app-ui:jvmTest --warning-mode all
      - name: Desktop app build
        run: ./gradlew --no-daemon --max-workers=5 --build-cache --init-script tools/ci/ci-parallel.init.gradle.kts :desktop-app:build --warning-mode all
      - name: Every compiled test class is listed in the shard manifest
        run: python3 tools/ci/verify-shard-coverage.py --manifest tools/ci/ledger-data-shards.txt --classes ledger-data/build/classes/kotlin/jvm/test --shards 5
      - name: Test timing report
        # Report-only: aggregates per-class JUnit XML timings into the job summary
        # and into timing-core.tsv, the measured input for repacking the shard
        # manifests. Never changes the check conclusion.
        if: always()
        run: python3 tools/ci/test-timing-report.py --root . --summary "$GITHUB_STEP_SUMMARY" --top 0 --tsv timing-core.tsv
      - name: Upload per-class timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-core
          path: timing-core.tsv
          if-no-files-found: warn
          retention-days: 7
      - name: Upload the Gradle profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-profile-core
          path: build/reports/profile/*.html
          if-no-files-found: warn
          retention-days: 7

  # The SQLDelight migration verification is a 3m27s single task that ran inside
  # `Kotlin tests core` and was the core job's longest item (D-303, batch E). It is
  # independent of the test tasks, so it gets its own parallel job instead of
  # stretching the aggregated run. It has no fork-bearing Test task, so the
  # parallelism init script is irrelevant here.
  kotlin-migration-verify:
    name: Kotlin migration verify
    needs: [changes]
    if: needs.changes.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-migration-verify-${{ github.run_id }}
          restore-keys: gradle-build-cache-${{ runner.os }}-migration-verify-
      - name: Verify the SQLDelight migrations
        run: ./gradlew --no-daemon --max-workers=4 --build-cache :ledger-data:verifyCommonMainLedgerDatabaseMigration --warning-mode all

  ledger-data-shards:
    name: ledger-data shard ${{ matrix.shard }}
    needs: [changes]
    if: needs.changes.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Repacked by measured class seconds, not by class count (D-303): a single
        # 251 s class used to dominate whichever shard received it.
        shard: [1, 2, 3, 4, 5]
    env:
      CI_TEST_MAX_PARALLEL_FORKS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Cache Gradle build cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: gradle-build-cache-${{ runner.os }}-
      - name: ledger-data jvmTest (shard ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t classes < <(awk -F'\t' -v s="$SHARD" '$1==s {print $2}' tools/ci/ledger-data-shards.txt)
          echo "shard $SHARD: ${#classes[@]} classes"
          args=()
          for one in "${classes[@]}"; do args+=(--tests "$one"); done
          ./gradlew --no-daemon --max-workers=4 --build-cache --init-script tools/ci/ci-parallel.init.gradle.kts :ledger-data:jvmTest "${args[@]}" --warning-mode all
      - name: Shard ran exactly its share of the manifest
        run: python3 tools/ci/verify-shard-coverage.py --manifest tools/ci/ledger-data-shards.txt --shard ${{ matrix.shard }} --results ledger-data/build/test-results/jvmTest
      - name: Test timing report
        if: always()
        run: python3 tools/ci/test-timing-report.py --root . --summary "$GITHUB_STEP_SUMMARY" --top 0 --tsv timing-shard-${{ matrix.shard }}.tsv
      - name: Upload per-class timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-shard-${{ matrix.shard }}
          path: timing-shard-${{ matrix.shard }}.tsv
          if-no-files-found: warn
          retention-days: 7
      - name: Recorded scale readings
        if: always()
        run: python3 tools/ci/scale-readings-report.py --root . --summary "$GITHUB_STEP_SUMMARY"

  kotlin-gate:
    # Owns the branch-protection context name "Kotlin tests" and must always run:
    # a failed or unexpectedly skipped dependency has to become a red required
    # check. It recomputes the change classification independently of the
    # `changes` job and fails on disagreement, because a skipped job reports
    # success - which is exactly why the docs-only path needs this gate instead of
    # a workflow-level filter (D-302, T1).
    name: Kotlin tests
    needs: [changes, kotlin-core, ledger-data-shards, kotlin-migration-verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the pull request base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" || echo "::warning::base commit unavailable; the classifier falls back to code"
      - name: Require the Kotlin jobs that the classification demands
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DECLARED_KIND: ${{ needs.changes.outputs.kind }}
          CORE_RESULT: ${{ needs.kotlin-core.result }}
          SHARDS_RESULT: ${{ needs.ledger-data-shards.result }}
          MIGRATION_RESULT: ${{ needs.kotlin-migration-verify.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT declared=$DECLARED_KIND core=$CORE_RESULT shards=$SHARDS_RESULT migration=$MIGRATION_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change classification did not succeed"
            exit 1
          fi
          kind=$(python3 tools/ci/classify-changes.py --base "$BASE_SHA" --head HEAD)
          if [ "$kind" != "$DECLARED_KIND" ]; then
            echo "::error::Classification disagreement: changes job said $DECLARED_KIND, gate recomputed $kind"
            exit 1
          fi
          if [ "$kind" = "docs" ]; then
            if [ "$CORE_RESULT" != "skipped" ] || [ "$SHARDS_RESULT" != "skipped" ] || [ "$MIGRATION_RESULT" != "skipped" ]; then
              echo "::error::A docs-only change ran the Kotlin jobs"
              exit 1
            fi
          elif [ "$CORE_RESULT" != "success" ] || [ "$SHARDS_RESULT" != "success" ] || [ "$MIGRATION_RESULT" != "success" ]; then
            echo "::error::Kotlin verification did not fully succeed"
            exit 1
          fi

  android:
    # Four workers mirror the shard jobs (D-303): serial @1 worker made this job
    # the critical path at 6.4 min. Build caching stays off the unit-test step so
    # a required check always executes the tests instead of restoring them from
    # cache; memory stays at the global 3 g heap.
    name: Android compile
    needs: [changes]
    if: needs.changes.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Compile Android
        run: ./gradlew --no-daemon --max-workers=4 --build-cache :ledger-data:compileAndroidMain --warning-mode all
      - name: Android app unit tests
        # P5-04.4 S2/S3: JVM unit tests for AndroidStartupController (no Robolectric). The
        # task set must match docs/CONTRIBUTING.md verification commands. The appended
        # :ledger-domain:testAndroidHostTest task runs the shared commonTest suite on the
        # Android host-test compilation face (D-238 A02 gap (iii), spec 2.3 both-ends clause).
        run: ./gradlew --no-daemon --max-workers=4 :android-app:testDebugUnitTest :ledger-domain:testAndroidHostTest --warning-mode all
      - name: Android app test sources and debug APK
        # P0 hotfix (defect 1) guard: compile the androidTest sources so the absolute-driver-path
        # regression guard cannot rot. Device execution belongs to the separate
        # ordinary regression and scale preflight workflows. One invocation for both build
        # tasks (D-303 batch D): a second gradle run pays another JVM start and configuration
        # for the same inputs.
        run: ./gradlew --no-daemon --max-workers=4 --build-cache :android-app:assembleDebugAndroidTest :android-app:assembleDebug --warning-mode all
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk-${{ github.sha }}
          path: android-app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Package both APKs with whole-tree provenance
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        id: apk-bundle
        run: python3 tools/ci/android-apks.py pack --directory android-apks --app android-app/build/outputs/apk/debug/android-app-debug.apk --test android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk
      - name: Upload verified APK bundle
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk-bundle.outputs.artifact }}
          path: android-apks/*
          if-no-files-found: error
          retention-days: 7

  # The Python suite is split across two runners; tools/ci/python-shards.txt
  # says which modules each runner takes.
  python-shards:
    name: Python shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t modules < <(awk -F'\t' -v s="$SHARD" '$1==s {print $2}' tools/ci/python-shards.txt)
          echo "shard $SHARD: ${#modules[@]} modules"
          export PYTHONPATH=tools/python
          python -m unittest -v "${modules[@]}"
      - name: Project docs
        if: matrix.shard == 1
        run: |
          export PYTHONPATH=tools/python
          python -m project_docs .
      - name: Every Python test module is listed in the shard manifest
        run: python tools/ci/verify-shard-coverage.py --python-manifest tools/ci/python-shards.txt --tests-dir tests/python

  python-gate:
    # Owns the branch-protection context name "Python tests": it must always run and
    # fails whenever a Python shard failed.
    name: Python tests
    needs: [python-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Python verification job to succeed
        run: |
          echo "python-shards=${{ needs.python-shards.result }}"
          if [ "${{ needs.python-shards.result }}" != "success" ]; then
            echo "::error::Python verification did not fully succeed"
            exit 1
          fi

  trace:
    name: Trace scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        # The history scans (messages, paths, trees) must see the full
        # history; the checkout default of depth 1 would silently reduce
        # them to the tip commit.
        with:
          fetch-depth: 0
      - name: Trace scan
        # A pull-request run scans only the commits it adds plus the whole
        # tracked tree; main and manual dispatches leave the variable unset and
        # keep the full-history scans, which is what proves every landed commit
        # was scanned at least once (D-302, T2).
        env:
          TRACE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash tools/ci/trace-scan.sh
