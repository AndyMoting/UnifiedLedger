name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners have enough memory for the Android/KMP build, but the
# Gradle defaults are too small for compileAndroidMain and dex merging.
env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g
    -Dkotlin.daemon.jvmargs=-Xmx2g
    -Dorg.gradle.workers.max=1

jobs:
  kotlin:
    name: Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Gradle check
        run: ./gradlew --no-daemon --max-workers=1 check --warning-mode all
      - name: Ktlint check
        run: ./gradlew --no-daemon --max-workers=1 ktlintCheck --warning-mode all
      - name: Shared UI tests
        run: ./gradlew --no-daemon --max-workers=1 :app-ui:jvmTest --warning-mode all
      - name: Desktop app build
        run: ./gradlew --no-daemon --max-workers=1 :desktop-app:build --warning-mode all
      - name: SQLDelight migration
        run: ./gradlew --no-daemon --max-workers=1 :ledger-data:verifyCommonMainLedgerDatabaseMigration --warning-mode all

  android:
    name: Android compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Compile Android
        run: ./gradlew --no-daemon --max-workers=1 :ledger-data:compileAndroidMain --warning-mode all
      - name: Android app unit tests
        # P5-04.4 S2/S3: JVM unit tests for AndroidStartupController (no Robolectric). The
        # task set must match docs/CONTRIBUTING.md verification commands.
        run: ./gradlew --no-daemon --max-workers=1 :android-app:testDebugUnitTest --warning-mode all
      - name: Android app assemble debug
        run: ./gradlew --no-daemon --max-workers=1 :android-app:assembleDebug --warning-mode all
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk-${{ github.sha }}
          path: android-app/build/outputs/apk/debug/*.apk
          retention-days: 7

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          export PYTHONPATH=tools/python
          python -m unittest discover -s tests -t . -v
      - name: Project docs
        run: |
          export PYTHONPATH=tools/python
          python -m project_docs .
