# Android instrumented tests (non-blocking device signal, D-197).
#
# NOT part of the required PR checks. It runs the device-only ordinary
# regression on hardware-accelerated GitHub-hosted emulators so that layer stops
# depending on someone remembering to boot a local AVD.
#
# Topology (two device paths, one signal name):
#   trusted path - same-repository pull request or manual dispatch:
#     apks    - one producer job. It first asks `tools/ci/android-apks.py
#               reuse` for an already-published whole-tree APK bundle (same
#               source tree, trusted producer, verified provenance); only a
#               genuine miss builds. It then packs and uploads a bundle that
#               carries this run's provenance, independent of any device
#               result.
#     shard   - two independent runners. Each downloads and verifies that
#               bundle, boots exactly one AVD, installs both APKs directly, and
#               runs `am instrument -w -r -e class <class#method,...>` for the
#               cases `tools/ci/android-instrumented-shards.txt` assigns to it.
#               No Gradle task runs inside the emulator session: compilation is
#               the producer's job, and the action kills the emulator when
#               `script` ends.
#   fork path - fork pull request only:
#     fork-fallback - one runner builds both APKs and runs all 41 ordinary
#               cases on one emulator with the same direct-instrumentation
#               driver. It shares no artifact with the trusted path, because a
#               fork run can neither produce nor consume a verified bundle.
#   gate      - keeps the device signal name `Android instrumented tests`. It
#               runs for both paths and fails when the applicable path failed,
#               was skipped, or never produced its evidence.
#
# Facts this file depends on:
# - GitHub announced hardware acceleration for 2-vCPU hosted Linux runners
#   (2024-04-02 changelog); this repository is public, so the runner has
#   4 vCPU / 16 GB. The KVM snippet below is the documented one.
# - api-level 36 / target google_apis / arch x86_64 mirror the managed local AVD;
#   API 37 images have never reached adb on the development host. `profile:
#   pixel_6` pins 1080x2400 at density 420, the same device the scale chain
#   uses, so a shard fails loudly instead of drifting to another geometry.
# - The action runs `script` with /usr/bin/sh (dash): `set -o pipefail` is
#   illegal there, and a trailing backslash reaches the command as a literal
#   argument. The folded scalars below produce one single-line command each,
#   and every other command stays on one line.
# - ImportScaleTraversalInstrumentedTest is excluded: it hardcodes 1080x2400
#   tab-bar geometry and fallback coordinates, so it is coupled to one device
#   profile. The ordinary inventory (41 cases over 9 classes) is the explicit
#   allowlist the shards execute.
# - A trusted APK bundle records the producing repository and run, and
#   `android-apks.py verify` rejects any run whose `head_repository` is a fork.
#   Fork pull requests therefore take the fallback path above instead of losing
#   the ordinary device signal they had before the split.
# - Measured on this repository before the split (2026-10-01, throwaway probe,
#   three attempts of one commit): whole job 407-417s, building both APKs
#   212-225s, emulator boot 44.6-52.5s. The split moves the build into the
#   producer and lets the two shards overlap their boots and their runs.
name: Android instrumented tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'app-ui/**'
      - 'ledger-data/**'
      - 'ledger-application/**'
      - 'ledger-domain/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      # This workflow file itself, so that a change to the device job is verified
      # by the device job on its own pull request (for pull_request events the
      # workflow file is taken from the pull request head).
      - '.github/workflows/android-instrumented.yml'
      - 'tools/ci/android-instrumented-*'
      - 'tools/ci/android-apks.py'
      # Directory-level: the shard runner imports the shared device and result
      # helpers, so watching the whole package is stabler than naming each file.
      - 'tools/python/android_scale/**'
      - 'tests/python/test_android_ci_repair.py'
      - 'tests/python/test_android_instrumented_shards.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Cancel superseded pull-request runs, but let a manual run finish: for
# workflow_dispatch github.ref is the default branch, and a stale cancel would
# discard the only signal that run was asked for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apks:
    # Owns the ordinary device regression's APK bundle. The job name is part of
    # `tools/python/android_scale/apks.py`'s producer whitelist: the pack step
    # records this workflow and job identity, and every consumer re-verifies
    # both through the GitHub API.
    name: Android instrumented APKs
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx3g
        -Dkotlin.daemon.jvmargs=-Xmx2g
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Check ordinary device source inventory
        run: python3 tools/ci/android-instrumented-inventory.py --source android-app/src/androidTest --manifest tools/ci/android-instrumented-inventory.txt
      - name: Check the shard split partitions the inventory
        # Static: fails before any device boots when a class was added, removed,
        # or renamed without updating tools/ci/android-instrumented-shards.txt.
        run: python3 tools/ci/android-instrumented-cloud.py check --inventory tools/ci/android-instrumented-inventory.txt --shards tools/ci/android-instrumented-shards.txt
      - name: Discover and verify an earlier whole-tree APK bundle
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/android-apks.py reuse --directory reused-apks
      - name: Build missing APKs before the emulator sessions
        if: steps.reuse.outputs.hit != 'true'
        run: ./gradlew --no-daemon --max-workers=1 :android-app:assembleDebug :android-app:assembleDebugAndroidTest --warning-mode all
      - name: Package APKs with this producer's provenance
        id: bundle
        run: |
          set -euo pipefail
          if [ '${{ steps.reuse.outputs.hit }}' = 'true' ]; then
            python3 tools/ci/android-apks.py pack --directory instrumented-apks --app reused-apks/android-app-debug.apk --test reused-apks/android-app-debug-androidTest.apk --reused-from reused-apks
          else
            python3 tools/ci/android-apks.py pack --directory instrumented-apks --app android-app/build/outputs/apk/debug/android-app-debug.apk --test android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk
          fi
      - name: Upload APKs independently of device results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: instrumented-apks/*
          if-no-files-found: error
          retention-days: 7

  shard:
    name: Android instrumented shard ${{ matrix.shard }}
    needs: apks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apks.outputs.artifact }}
          path: instrumented-apks
      - name: Verify downloaded source and both APK hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/android-apks.py verify --directory instrumented-apks
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run this shard's instrumented cases on one emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: ul-instrumented-${{ matrix.shard }}
          profile: pixel_6
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            python3 tools/ci/android-instrumented-cloud.py run
            --shard ${{ matrix.shard }}
            --avd ul-instrumented-${{ matrix.shard }}
            --inventory tools/ci/android-instrumented-inventory.txt
            --shards tools/ci/android-instrumented-shards.txt
            --app instrumented-apks/android-app-debug.apk
            --test instrumented-apks/android-app-debug-androidTest.apk
            --evidence instrumented-evidence/shard-${{ matrix.shard }}
            --sha "${{ github.sha }}"
      - name: Require exactly this shard's cases to have passed
        # The job must not rely on the driver's own exit code relayed through a
        # third-party action. This gate re-parses the raw `am instrument`
        # transcript, re-checks the JUnit report, the device configuration and
        # the exported logcat, and runs even when the emulator step failed so a
        # red run can never leave the shard green.
        if: always()
        run: python3 tools/ci/android-instrumented-cloud.py validate --shard ${{ matrix.shard }} --inventory tools/ci/android-instrumented-inventory.txt --shards tools/ci/android-instrumented-shards.txt --evidence instrumented-evidence/shard-${{ matrix.shard }} --sha "${{ github.sha }}"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-${{ github.sha }}-shard-${{ matrix.shard }}
          path: instrumented-evidence/**
          if-no-files-found: error
          retention-days: 7

  fork-fallback:
    # Fork pull requests cannot produce or consume a trusted APK bundle: the
    # bundle records the producing repository and run, and `android-apks.py
    # verify` rejects a fork run. This job keeps the ordinary device coverage
    # they had before the split: one runner builds both APKs and runs all 41
    # ordinary cases on one emulator with the same direct-instrumentation
    # driver. It shares no artifact with the trusted shard path.
    name: Android instrumented fork fallback
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx3g
        -Dkotlin.daemon.jvmargs=-Xmx2g
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Check ordinary device source inventory
        run: python3 tools/ci/android-instrumented-inventory.py --source android-app/src/androidTest --manifest tools/ci/android-instrumented-inventory.txt
      - name: Build both APKs before the emulator session
        run: ./gradlew --no-daemon --max-workers=1 :android-app:assembleDebug :android-app:assembleDebugAndroidTest --warning-mode all
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run all ordinary cases on one emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: ul-instrumented-fork
          profile: pixel_6
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            python3 tools/ci/android-instrumented-cloud.py run-fork
            --avd ul-instrumented-fork
            --inventory tools/ci/android-instrumented-inventory.txt
            --app android-app/build/outputs/apk/debug/android-app-debug.apk
            --test android-app/build/outputs/apk/androidTest/debug/android-app-debug-androidTest.apk
            --evidence instrumented-evidence/fork
            --sha "${{ github.sha }}"
      - name: Require all ordinary cases to have passed
        if: always()
        run: python3 tools/ci/android-instrumented-cloud.py validate-fork --inventory tools/ci/android-instrumented-inventory.txt --evidence instrumented-evidence/fork --sha "${{ github.sha }}"
      - name: Upload fork evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-${{ github.sha }}-fork
          path: instrumented-evidence/**
          if-no-files-found: error
          retention-days: 7

  instrumented:
    # Keeps the device-signal name that existed before the split and covers both
    # paths: the trusted path requires the producer and both shards to succeed;
    # the fork path requires its single fallback job to succeed. A job that is
    # skipped or cancelled never reports `success`, so a missing part fails here
    # too, and the gate itself always runs.
    name: Android instrumented tests
    needs: [apks, shard, fork-fallback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable device path to succeed
        env:
          APKS: ${{ needs.apks.result }}
          SHARDS: ${{ needs.shard.result }}
          FORK: ${{ needs.fork-fallback.result }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          echo "event=${EVENT} head=${HEAD_REPO} base=${BASE_REPO}"
          echo "apks=${APKS} shards=${SHARDS} fork=${FORK}"
          if [ "${EVENT}" = "pull_request" ] && [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            if [ "${FORK}" != "success" ]; then
              echo "::error::fork device fallback did not succeed"
              exit 1
            fi
          elif [ "${APKS}" != "success" ] || [ "${SHARDS}" != "success" ]; then
            echo "::error::Android instrumented tests did not fully succeed"
            exit 1
          fi
